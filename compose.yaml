name: interview-evidence-platform

# The application processes run on the host, so this reusable block documents the exact
# opt-in variables they receive rather than pretending the worker is a Compose service.
# Both test controls remain disabled by default. CONTROLPROOF_FAULT_ROOT must resolve to
# the same host directory for the WhyYou worker and ControlProof runner.
x-controlproof-test-controls: &controlproof-test-controls
  CONTROLPROOF_TEST_HOOKS_ENABLED: ${CONTROLPROOF_TEST_HOOKS_ENABLED:-false}
  CONTROLPROOF_MODEL_SUBSTITUTE_ENABLED: ${CONTROLPROOF_MODEL_SUBSTITUTE_ENABLED:-false}
  CONTROLPROOF_MODEL_FIXTURE_ID: ${CONTROLPROOF_MODEL_FIXTURE_ID:-h03-report-v1}
  CONTROLPROOF_FAULT_ROOT: ${CONTROLPROOF_FAULT_ROOT:-.controlproof/faults}
  CONTROLPROOF_OBSERVER_ENABLED: ${CONTROLPROOF_OBSERVER_ENABLED:-false}
  CONTROLPROOF_OBSERVER_ROOT: ${CONTROLPROOF_OBSERVER_ROOT:-.controlproof/observers}
  CONTROLPROOF_EXTERNAL_AI_ALLOWED: ${CONTROLPROOF_EXTERNAL_AI_ALLOWED:-false}

# Bounded host paths used if the API/worker is later containerized. No public fault
# endpoint or broad workspace mount is exposed.
x-controlproof-test-mounts: &controlproof-test-mounts
  - ${CONTROLPROOF_FAULT_ROOT:-.controlproof/faults}:/var/run/controlproof/faults
  - ${CONTROLPROOF_OBSERVER_ROOT:-.controlproof/observers}:/var/run/controlproof/observers

# Local infrastructure only -- Postgres, LocalStack and Mailpit. The API and worker are
# here: they run on the host with `make api` / `make worker`, against the production runtime
# (`create_production_runtime`) that the deployed environment uses. There is no separate local
# application wiring to keep in sync, and no image to rebuild after every edit.
#
# Everything reachable through an endpoint override lands here; everything else -- Bedrock,
# Cognito, Transcribe, Polly and MediaConvert -- goes to real AWS, because
# `runtime/aws.py:_client_factory` only redirects the services listed there. That is deliberate:
# see docs/local-development.md for what it means and what it costs.
# PDF OCR uses GCP Document AI through the same service account as GCP speech.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_evidence}
      POSTGRES_USER: ${POSTGRES_USER:-iep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-iep} -d ${POSTGRES_DB:-interview_evidence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # No `SERVICES` whitelist. The runtime endpoint-overrides s3, sqs, sesv2 and secretsmanager
  # (`runtime/aws.py:_client_factory`), and pinning a list means one wrong service name turns a
  # working call into a connection refused. Unset, LocalStack starts each community service on
  # first use, which covers all four without naming any.
  #
  # The local API sends invitation mail directly to Mailpit over SMTP. SES remains available in
  # LocalStack for AWS adapter tests, but is not the local invitation delivery path.
  localstack:
    image: localstack/localstack:3.8
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - localstack-data:/var/lib/localstack

  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.22.3
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8025/api/v1/info >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  localstack-data:
